services:
  postgres:
    # Keep the major version in sync with Neon (production) and CI.
    image: postgres:18-alpine
    container_name: autokg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auto}
      POSTGRES_DB: ${POSTGRES_DB:-auto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/<major>/docker — mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
